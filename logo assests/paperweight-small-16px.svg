<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Paperweight 16px Optic Pixel-Fitted Icon">
  <!-- Highlighter Yellow Squircle Background -->
  <rect width="16" height="16" rx="3.5" fill="#F2D14B" stroke="#151517" stroke-opacity="0.16" stroke-width="0.5"/>
  
  <!-- Under sheet lip -->
  <rect x="2" y="9" width="12" height="5" rx="1" fill="#E9E8E4" transform="rotate(-1.5 8 11.5)"/>
  
  <!-- Crisp Paper Sheet -->
  <rect x="2" y="9.5" width="12" height="4.5" rx="1" fill="#F7F5EF"/>
  <rect x="3" y="10.8" width="2.5" height="2" rx="0.4" fill="#1F1F22"/>
  <line x1="6.5" y1="11.2" x2="12.5" y2="11.2" stroke="#A9A79F" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="6.5" y1="12.6" x2="10.5" y2="12.6" stroke="#A9A79F" stroke-width="0.9" stroke-linecap="round"/>
  
  <!-- Contact Shadow -->
  <ellipse cx="8" cy="9.2" rx="5.5" ry="0.8" fill="#151517" opacity="0.45"/>
  
  <!-- Cast-Iron Handle -->
  <path d="M6 6V4.5C6 3.5 6.9 2.6 8 2.6C9.1 2.6 10 3.5 10 4.5V6" fill="none" stroke="#1F1F22" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M6.8 4C7.2 3.4 7.6 3.1 8 3.1C8.4 3.1 8.8 3.4 9.2 4" fill="none" stroke="#6B6964" stroke-width="0.9" stroke-linecap="round"/>
  
  <!-- Cast-Iron Body -->
  <path d="M4.5 6H11.5L13 9.5H3L4.5 6Z" fill="#151517"/>
  <line x1="5" y1="6.4" x2="11" y2="6.4" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Force Chevron -->
  <path d="M7 7.4L8 8.4L9 7.4" fill="none" stroke="#F2D14B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
