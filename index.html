<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Private Offline Document & Image Workspace</title>
    
    <!-- Strict Privacy CSP: connect-src 'none' guarantees zero external network requests -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: http: blob: data:; object-src 'none'; base-uri 'self';"
    />
    
    <meta name="description" content="Runs fully on your device. Fast, zero-network document and image toolkit." />
    <meta name="theme-color" content="#151517" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #151517;
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      *, *::before, *::after {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input, textarea, [contenteditable="true"], .selectable-text, .textLayer, .textLayer * {
        -webkit-user-select: text;
        user-select: text;
      }
      button, a, input, select, textarea, [role="button"], [role="tab"] {
        touch-action: manipulation;
      }
      html.light, html.light body {
        background-color: #E9E8E4 !important;
      }
      html.dark, html.dark body {
        background-color: #151517 !important;
      }
    </style>

    <!-- Inline pre-paint script: initialize safe areas immediately and eliminate theme flash -->
    <script>
      (function() {
        if (/android/i.test(navigator.userAgent)) {
          var defaultTop = 36;
          try {
            if (window.AndroidBridge && typeof window.AndroidBridge.getStatusBarHeight === 'function') {
              var bridgeTop = window.AndroidBridge.getStatusBarHeight();
              if (bridgeTop > 0) defaultTop = bridgeTop;
              var bridgeBottom = window.AndroidBridge.getNavigationBarHeight();
              if (bridgeBottom > 0) document.documentElement.style.setProperty('--safe-area-inset-bottom', bridgeBottom + 'px');
            }
          } catch (e) {}
          document.documentElement.style.setProperty('--safe-area-inset-top', defaultTop + 'px');

          if (typeof window !== 'undefined' && 'caches' in window) {
            try {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) caches.delete(names[i]);
              });
            } catch (e) {}
          }
        }

        try {
          var saved = localStorage.getItem('paperweight-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : saved === 'system'
            ? (systemDark ? 'dark' : 'light')
            : 'dark';
          var isDark = theme === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#151517';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#E9E8E4';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (window.AndroidBridge && typeof window.AndroidBridge.setAppTheme === 'function') {
            window.AndroidBridge.setAppTheme(isDark);
          }
          if (window.electronAPI && typeof window.electronAPI.setTheme === 'function') {
            window.electronAPI.setTheme(isDark ? 'dark' : 'light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#151517';
          if (window.AndroidBridge && typeof window.AndroidBridge.setAppTheme === 'function') {
            window.AndroidBridge.setAppTheme(true);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-surface-bg text-text-main antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
